server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Behind another proxy (Caddy, Tailscale Funnel), take the client address from
    # X-Forwarded-For so the API's per-client rate limit doesn't lump everyone together.
    # Only private, loopback and tailnet peers are trusted to set it.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Hashed bundles never change; index.html must be revalidated so a redeploy shows up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:3124;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # $http_host keeps the port. The API compares it with the browser's Origin to accept
        # writes from a session, so dropping the port (as $host does) rejects every write
        # when the UI is opened at http://<host>:5173.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Folder .zips are streamed; pass them through instead of buffering to disk.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
