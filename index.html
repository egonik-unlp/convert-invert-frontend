
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>SyncDash — Soulseek bridge</title>
  <script>
    // Apply the saved theme before first paint to avoid a flash. Defaults to dark:
    // this console is usually watched in a dim room during long-running transfers.
    (function () {
      try {
        var stored = localStorage.getItem("relay-theme");
        var dark = stored ? stored === "dark" : true;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
</head>
<body>
  <div id="root">
    <div id="boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0d16;color:#e2e8f0;font-family:Inter,system-ui,sans-serif">
      <div style="text-align:center">
        <div style="font-weight:700;letter-spacing:-0.01em">SyncDash</div>
        <div id="boot-status" style="margin-top:8px;color:#94a3b8;font-size:14px">Starting console…</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var status = document.getElementById('boot-status');
      if (status) status.textContent = 'Loading module…';
      function showBootError(message) {
        var fallback = document.getElementById('boot-fallback');
        if (!fallback) return;
        fallback.innerHTML =
          '<div style="max-width:720px;padding:24px;text-align:left">' +
          '<div style="font-weight:700;font-size:18px;margin-bottom:8px">SyncDash could not start</div>' +
          '<pre style="white-space:pre-wrap;color:#fca5a5;background:#1e1b2e;border:1px solid #7f1d1d;padding:16px;border-radius:8px;font-size:12px;line-height:1.5">' +
          String(message).replace(/[<>&]/g, function (c) { return ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c]; }) +
          '</pre></div>';
      }
      window.addEventListener('error', function (event) {
        showBootError(event.message || 'Unknown JavaScript error');
      });
      window.addEventListener('unhandledrejection', function (event) {
        showBootError((event.reason && (event.reason.stack || event.reason.message)) || event.reason || 'Unhandled promise rejection');
      });
      window.__syncDashBooted = function () {
        var status = document.getElementById('boot-status');
        if (status) status.textContent = 'Module loaded.';
      };
    })();
  </script>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
