<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>convert/invert</title>
  <script>
    // Apply the theme and language before first paint. Theme: the saved choice, else the system's.
    (function () {
      var root = document.documentElement;
      try {
        var stored = localStorage.getItem("relay-theme");
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        root.classList.toggle("dark", dark);
        var lang = localStorage.getItem("ci-lang");
        root.lang = lang === "es" || lang === "en" ? lang : (navigator.language || "").toLowerCase().indexOf("es") === 0 ? "es" : "en";
      } catch (e) {
        root.classList.add("dark");
      }
    })();
  </script>
</head>
<body>
  <div id="root">
    <div id="boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font:13px system-ui,sans-serif">
      <div id="boot-status" style="opacity:.6">convert/invert</div>
    </div>
  </div>
  <script>
    (function () {
      function showBootError(message) {
        var fallback = document.getElementById('boot-fallback');
        if (!fallback) return;
        fallback.innerHTML =
          '<div style="max-width:640px;padding:24px;text-align:left">' +
          '<div style="font-weight:600;margin-bottom:8px">convert/invert could not start</div>' +
          '<pre style="white-space:pre-wrap;font-size:12px;line-height:1.5;opacity:.8">' +
          String(message).replace(/[<>&]/g, function (c) { return ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c]; }) +
          '</pre></div>';
      }
      window.addEventListener('error', function (event) {
        showBootError(event.message || 'Unknown JavaScript error');
      });
      window.addEventListener('unhandledrejection', function (event) {
        showBootError((event.reason && (event.reason.stack || event.reason.message)) || event.reason || 'Unhandled promise rejection');
      });
      window.__syncDashBooted = function () {};
    })();
  </script>
  <style>
    html.dark body { background: #121214; color: #e7e7ea; }
    html:not(.dark) body { background: #fafafa; color: #18181b; }
  </style>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
